# Build the codexhost extension ZIP and attach it to a GitHub Release
# whenever a tag like v1.0.0 is pushed.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check tag matches manifest version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != manifest v$VERSION"; exit 1; }
      - name: Build ZIP
        run: node tools/pack.mjs
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
