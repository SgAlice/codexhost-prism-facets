# Build the codexhost extension ZIP and publish a GitHub Release when a tag
# like v1.2.3 is pushed. Per the codexhost extension registry rules, the
# Release carries exactly one .zip plus the manifest's icon and screenshots as
# separate assets named after the last path segment (byte-identical to the ZIP).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check tag matches manifest version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != manifest v$VERSION"; exit 1; }
      - name: Build ZIP
        run: node tools/pack.mjs
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IMAGES=$(node -p "const m=require('./manifest.json'); [m.icon, ...(m.screenshots||[])].filter(Boolean).join(' ')")
          gh release create "$GITHUB_REF_NAME" dist/*.zip $IMAGES --title "$GITHUB_REF_NAME" --generate-notes
